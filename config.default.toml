# map-mcp's settings. `claude-voice plugins install` copies this file to
# ~/.config/map-mcp/config.toml the first time, and never over one that exists.

# Answer from the made-up places in fake.py instead of asking Kartverket. Kartverket needs
# no key and no device, so a real run is the default; `--simulate` does the same for one run.
simulate = false
